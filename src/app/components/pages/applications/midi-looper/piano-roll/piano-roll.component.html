<div style="display:flex; gap:8px; align-items:center; margin-bottom:4px;">
  <button type="button" (click)="expandRangeUp()" [disabled]="maxPitch >= absoluteMaxPitch">Expand Range &#9650;</button>
  <button type="button" (click)="expandRangeDown()" [disabled]="minPitch <= absoluteMinPitch">Expand Range &#9660;</button>
</div>
<div class="piano-roll" #scrollContainer style="overflow:auto; max-height:400px;">
  <table>
    <tr *ngFor="let pitch of pitches" [attr.data-pitch]="pitch">
      <td class="pitch-label">{{ pitch }} &middot; {{ pitchLabel(pitch) }}</td>
      <td *ngFor="let step of stepIndices()"
          [style.background]="isNoteActive(pitch, step) ? 'purple' : (isCurrentStep(step) ? 'rgba(255, 200, 0, 0.25)' : 'transparent')"
          [style.border-left-width.px]="isConnectedToPrevious(pitch, step) ? 0 : (lineClass(step) === 'measure' ? 5 : (lineClass(step) === 'beat' ? 2 : 1))"
          [style.border-left-color]="lineClass(step) === 'normal' ? '#ccc' : '#333'"
          [style.border-top]="isCurrentStep(step) ? '2px solid orange' : '1px solid #ccc'"
          [style.border-bottom]="isCurrentStep(step) ? '2px solid orange' : '1px solid #ccc'"
          style="border-left-style:solid; border-right:1px solid #ccc; width:16px; height:14px; cursor:pointer; user-select:none;"
          (mousedown)="startDrag(pitch, step)"
          (mouseenter)="continueDrag(pitch, step)">
      </td>
    </tr>
  </table>
</div>
