server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    # The two sha256 hashes allow exactly two inline scripts: the Angular critical-CSS
    # script (it restores the media attribute on link[data-beasties-media]) that applies
    # styles.css, and the https redirect script in src/index.html. If either changes, the hash must be recomputed:
    # scripts/check-csp-hashes.js (run by the Docker build) fails and prints the new hash.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-LMY6wYoFV9I4wWzxaq1N/dTpl4iurQktw706UCHK3vM=' 'sha256-CfI5R+VZPn5M3KqSKOHJXX9X6jhKz4owR6mOR24f7QA=' https://code.jquery.com https://cdnjs.cloudflare.com https://stackpath.bootstrapcdn.com; style-src 'self' 'unsafe-inline' https://www.w3schools.com https://stackpath.bootstrapcdn.com https://use.fontawesome.com https://fonts.googleapis.com; font-src 'self' data: https://use.fontawesome.com https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://raw.githubusercontent.com https://github-contributions-api.jogruber.de; frame-src 'self' https://www.youtube.com https://nate314.github.io https://*.nathangawith.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # Angular client-side routing: fall back to index.html for unknown paths
    location / {
        try_files $uri $uri/ /index.html;
    }
}
